[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ociquickbastion-qb2"
version = "0.1.0"
description = "Interactive OCI Bastion helper (Compute & DB nodes)"
authors = [{name = "ociquickbastion"}]
requires-python = ">=3.9"
dependencies = [
  "oci>=2.0.0",
]
readme = "README.md"

[project.optional-dependencies]
tui = [
  "textual>=0.89.0",
]

[project.scripts]
qb = "qb2.cli:main"
qb2 = "qb2.cli:main"

[tool.setuptools]
packages = ["qb2"]
package-dir = { "qb2" = "src/qb2" }

[tool.setuptools.package-data]
qb2 = ["py.typed"]
